plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            // Kept apart from the 1.20.1 branch's run/ so worlds and mods don't cross versions.
            gameDirectory = project.file('run-26.1.2')
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    maven {
        name = "Jared's maven (JEI)"
        url = "https://maven.blamejared.com/"
        content {
            includeGroup 'mezz.jei'
            includeGroup 'net.mezzdev.config'
        }
    }
}

dependencies {
    // JEI is optional: compile against the API, run with the full jar in dev only.
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Copies the built jar into `deploy_dir` (gradle.properties). Skipped when the property is blank
// or the folder is missing, so the task is safe on machines without the target instance.
tasks.register('deployJar') {
    group = 'build'
    description = 'Copy the mod jar into deploy_dir (e.g. a Minecraft instance mods folder).'
    dependsOn 'jar'

    def deployDirProp = project.findProperty('deploy_dir')?.toString()?.trim()
    def jarFile = tasks.named('jar', Jar).flatMap { it.archiveFile }
    def modId = mod_id

    doLast {
        if (!deployDirProp) {
            logger.lifecycle("[deployJar] Skipped: 'deploy_dir' is not set in gradle.properties.")
            return
        }
        File target = new File(deployDirProp)
        if (!target.isDirectory()) {
            logger.warn("[deployJar] Skipped: deploy_dir does not exist or is not a directory: ${target.absolutePath}")
            return
        }

        File srcJar = jarFile.get().asFile
        target.listFiles()?.findAll {
            it.isFile() && it.name.startsWith("${modId}-") && it.name.endsWith(".jar")
        }?.each {
            logger.lifecycle("[deployJar] Removing old: ${it.name}")
            it.delete()
        }

        File dst = new File(target, srcJar.name)
        java.nio.file.Files.copy(srcJar.toPath(), dst.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        logger.lifecycle("[deployJar] Deployed ${srcJar.name} -> ${target.absolutePath}")
    }
}
